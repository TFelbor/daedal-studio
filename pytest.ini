[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
markers =
    integration: Tests requiring a running FastAPI server (no real printer needed)
    slow: Tests that take more than 30 seconds
    real_printer: Tests that require a real or simulated printer to be running
    full_pipeline: Tests that run the complete FLUX + TRELLIS.2 pipeline (needs a CUDA GPU or a reachable sculptor worker)
    dimensional_sweep: One spec from an archetype's declared envelope; tallied per archetype in the run summary (issue #85)
    prompt_jobs_benched: Opts out of the suite-wide ALLOW_PROMPT_JOBS default, so POST /jobs refuses a spec-less job as it does in production
addopts = -v --tb=short -m "not slow"
