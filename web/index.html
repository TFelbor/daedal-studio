<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Candidate 1B, the lay-down. Declared four ways on purpose.

         A lone SVG icon did not stick: browsers cache the favicon far harder than any
         other asset, several still prefer a bitmap when one is offered, and
         /favicon.ico is fetched from the document root whether it is declared or not —
         so an undeclared one leaves a 404 and the browser falls back to nothing. The
         ?v= query is the only reliable way to evict a cached icon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico?v=3" sizes="16x16 32x32 48x48 64x64" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` report anything
         other than zero: without it iOS letterboxes the page inside the safe area and
         the app stops short of the rounded corners, which in a standalone PWA reads as
         a web page someone put a frame around. With it, the page owns the full screen
         and the nav, the footer and the running view's action bar pad themselves out
         of the notch and the home indicator. `user-scalable` is left alone — pinch to
         zoom is not the app's to take away. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The browser chrome around the page. Two declarations so the colour is right
         before any script runs; `theme.ts` rewrites the active one when the viewer
         uses the in-app toggle, which no media query can see. -->
    <meta name="theme-color" content="#2f3030" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#dbdbdb" media="(prefers-color-scheme: light)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@300;400;500;600;700&display=swap"
    />
    <title>Daedal Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
