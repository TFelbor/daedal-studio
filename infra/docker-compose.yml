# ────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Primary development interface for ds-mvp pipeline.
#
# Usage (from project root):
#   cp .env.template .env                      # fill in OCTOPRINT_API_KEY
#   docker compose -f infra/docker-compose.yml build
#   docker compose -f infra/docker-compose.yml run --rm pipeline-runner \
#       python pythonsrc/pipeline.py "a ceramic vase" \
#       --print --start-print --verbose
#
# For GPU support (NVIDIA only):
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.gpu.yml up
#
# NOTE: All images are pinned to linux/amd64 because curaengine is only
# available as an amd64 apt package. On Apple Silicon, Docker Desktop
# transparently emulates amd64 via Rosetta 2.
#
# See docs/README-docker.md for the full command reference.
# ────────────────────────────────────────────────────────────────────────────


services:

  # ── Base image (shared foundation for all phase images) ──────────────────
  ds-base:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infra/docker/base.Dockerfile
    image: ds-base:latest

  # ── Phase 1: Visualizer (FLUX text-to-image) ─────────────────────────────
  phase1-visualizer:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infra/docker/phase1.Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: ds-phase1-visualizer:latest
    env_file:
      - path: ../.env
        required: false
    environment:
      FLUX_MODEL_PATH: /models/flux
      HF_HOME: /models/hf_cache
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACE_HUB_TOKEN: ${HF_TOKEN:-}
      PYTORCH_ENABLE_MPS_FALLBACK: "1"
    volumes:
      - ${HOST_PROJECT_ROOT:-..}/data/inputs:/app/data/inputs
      - ${HOST_PROJECT_ROOT:-..}/data/outputs:/app/data/outputs
      - ds-models-flux:/models/flux
      - ds-models-cache:/models/hf_cache
    profiles:
      - phase1
      - all

  # ── Phase 2: Sculptor client (TRELLIS.2 2D→3D) ───────────────────────────
  # The model itself is not in this image — TRELLIS.2 is CUDA-only. This service
  # posts the blueprint to the trellis2-worker below (or to any worker reachable
  # at DS_SCULPTOR_REMOTE_URL) and post-processes the mesh that comes back.
  phase2-sculptor:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infra/docker/phase2.Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: ds-phase2-sculptor:latest
    env_file:
      - path: ../.env
        required: false
    environment:
      DS_SCULPTOR_BACKEND: ${DS_SCULPTOR_BACKEND:-auto}
      DS_SCULPTOR_REMOTE_URL: ${DS_SCULPTOR_REMOTE_URL:-}
      DS_SCULPTOR_REMOTE_KEY: ${DS_SCULPTOR_REMOTE_KEY:-}
      TRELLIS2_PIPELINE_TYPE: ${TRELLIS2_PIPELINE_TYPE:-1024_cascade}
      TRELLIS2_MODEL_PATH: /models/trellis2
      HF_HOME: /models/hf_cache
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${HOST_PROJECT_ROOT:-..}/data/inputs:/app/data/inputs
      - ${HOST_PROJECT_ROOT:-..}/data/outputs:/app/data/outputs
      - ds-models-trellis2:/models/trellis2
      - ds-models-cache:/models/hf_cache
    profiles:
      - phase2
      - all

  # ── Phase 2 GPU worker (TRELLIS.2-4B, in-process) ────────────────────────
  # Behind its own profile because it is the one service that cannot start
  # without an NVIDIA GPU and the Container Toolkit. Run it on the GPU host:
  #   docker compose -f infra/docker-compose.yml --profile gpu-worker up trellis2-worker
  # Then point the pipeline at it via DS_SCULPTOR_REMOTE_URL.
  #
  # Set TORCH_CUDA_ARCH_LIST to the deployment GPU or the compiled kernels will
  # not load: 8.0=A100 8.6=A10G 8.9=L4 9.0=H100.
  trellis2-worker:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infra/docker/trellis2-worker.Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
        TORCH_CUDA_ARCH_LIST: ${TORCH_CUDA_ARCH_LIST:-8.0;8.6;8.9;9.0}
        TRELLIS2_REPO: ${TRELLIS2_REPO:-https://github.com/microsoft/TRELLIS.2.git}
        TRELLIS2_REF: ${TRELLIS2_REF:-main}
    image: ds-trellis2-worker:latest
    runtime: nvidia
    ports:
      - "8100:8100"
    env_file:
      - path: ../.env
        required: false
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      DS_WORKER_API_KEY: ${DS_WORKER_API_KEY:-}
      DS_WORKER_BACKEND: trellis2
      DS_WORKER_PRELOAD: ${DS_WORKER_PRELOAD:-true}
      TRELLIS2_PIPELINE_TYPE: ${TRELLIS2_PIPELINE_TYPE:-1024_cascade}
      TRELLIS2_MODEL_PATH: /models/trellis2
      HF_HOME: /models/hf_cache
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ds-models-trellis2:/models/trellis2
      - ds-models-cache:/models/hf_cache
    profiles:
      - gpu-worker

  # ── Phase 3: Engineer (manifold3d + trimesh, repair + scale) ─────────────
  phase3-engineer:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infra/docker/phase3.Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: ds-phase3-engineer:latest
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ${HOST_PROJECT_ROOT:-..}/data/inputs:/app/data/inputs
      - ${HOST_PROJECT_ROOT:-..}/data/outputs:/app/data/outputs
    profiles:
      - phase3
      - all

  # ── Phase 4: Slicer (CuraEngine) ─────────────────────────────────────────
  phase4-slicer:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infra/docker/phase4.Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: ds-phase4-slicer:latest
    env_file:
      - path: ../.env
        required: false
    environment:
      CURA_ENGINE_PATH: CuraEngine
    volumes:
      - ${HOST_PROJECT_ROOT:-..}/data/inputs:/app/data/inputs
      - ${HOST_PROJECT_ROOT:-..}/data/outputs:/app/data/outputs
    profiles:
      - phase4
      - all

  # ── Phase 5: Operator (OctoPrint REST client) ─────────────────────────────
  phase5-operator:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infra/docker/phase5.Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: ds-phase5-operator:latest
    env_file:
      - path: ../.env
        required: false
    environment:
      # Use host.docker.internal on macOS/Windows when OctoPrint runs on host.
      # On Linux (native Docker), use the host's LAN IP or host-gateway.
      OCTOPRINT_URL: ${OCTOPRINT_URL:-http://host.docker.internal:5001}
    volumes:
      - ${HOST_PROJECT_ROOT:-..}/data/inputs:/app/data/inputs
      - ${HOST_PROJECT_ROOT:-..}/data/outputs:/app/data/outputs
    profiles:
      - phase5
      - all

  # ── OctoPrint Simulator (Real Dockerized instance) ────────────────────────
  octoprint-simulator:
    image: octoprint/octoprint:latest
    ports:
      - "5001:80"
    volumes:
      - ${HOST_PROJECT_ROOT:-..}/data/octoprint:/octoprint
    profiles:
      - simulator

  # ── Pipeline Runner (orchestrator — chains all phases) ────────────────────
  # This is the primary entry point for end-to-end runs.
  # It does NOT depend_on the phase services above (they are separate images
  # for independent rebuilds). The pipeline-runner image contains all deps.
  pipeline-runner:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infra/docker/pipeline.Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: ds-mvp-pipeline:latest
    depends_on:
      - ds-base
    env_file:
      - path: ../.env
        required: false
    environment:
      FLUX_MODEL_PATH: /models/flux
      TRELLIS2_MODEL_PATH: /models/trellis2
      DS_SCULPTOR_BACKEND: ${DS_SCULPTOR_BACKEND:-auto}
      DS_SCULPTOR_REMOTE_URL: ${DS_SCULPTOR_REMOTE_URL:-}
      DS_SCULPTOR_REMOTE_KEY: ${DS_SCULPTOR_REMOTE_KEY:-}
      TRELLIS2_PIPELINE_TYPE: ${TRELLIS2_PIPELINE_TYPE:-1024_cascade}
      HF_HOME: /models/hf_cache
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACE_HUB_TOKEN: ${HF_TOKEN:-}
      PYTORCH_ENABLE_MPS_FALLBACK: "1"
      CURA_ENGINE_PATH: CuraEngine
      DS_LOGS_DIR: /app/data/logs
      # On macOS/Windows, OctoPrint on the host is reached via host.docker.internal.
      # Override in .env if your OctoPrint is at a different address.
      OCTOPRINT_URL: ${OCTOPRINT_URL:-http://host.docker.internal:5001}
      # The telemetry database: PostgreSQL on Supabase, one URL for every process —
      # native, container, pipeline subprocess. See "One database" in
      # docs/SYSTEM-AS-BUILT.md. It
      # arrives through `env_file` above and is deliberately **not** repeated under
      # `environment`, which is where it used to be:
      #
      #     DS_DATABASE_URL: ${DS_DATABASE_URL:-}
      #
      # That silenced the `env_file` it was written to complement. `environment` wins
      # over `env_file`, and `:-` turns an unset variable into an explicit empty string
      # rather than into nothing — and it was always unset, because compose looks for its
      # interpolation `.env` beside the compose file (`infra/`, which has none) and not
      # at the repository root. So every container was handed `DS_DATABASE_URL=""` and
      # raised `DatabaseConfigError` naming the variable `.env` did in fact set, while
      # `PIXAZO_API_KEY` and `OCTOPRINT_API_KEY` — named in `.env` and *not* shadowed
      # here — arrived from the same file perfectly. The pass-through form
      # (`DS_DATABASE_URL:` with no value) erases it just the same when the shell is
      # silent, so the entry has to be gone rather than rewritten. A caller that must
      # override `.env` passes `-e DS_DATABASE_URL=...`, which is what `server/app.py`
      # does for the pipeline it launches.
    volumes:
      - ${HOST_PROJECT_ROOT:-..}/data/inputs:/app/data/inputs
      - ${HOST_PROJECT_ROOT:-..}/data/outputs:/app/data/outputs
      - ${HOST_PROJECT_ROOT:-..}/data/logs:/app/data/logs
      - ${HOST_PROJECT_ROOT:-..}/pythonsrc:/app/pythonsrc
      # The config store's Fernet key (~/.ds-mvp/.config_key). HOME is /root in the
      # container, so the default key path resolves through this mount to the same
      # file the host uses — one key for one database.
      #
      # `$HOST_HOME` for the same reason `$HOST_PROJECT_ROOT` is above it: this service
      # is started by `docker compose run` from *inside* the api-server container, and a
      # bind mount's source is a path on the **host**. A bare `~` expanded there to that
      # container's own `/root`, which the host does not share, and every job submitted
      # through `make up` died before Phase 1 with
      # `mounts denied: The path /root/.ds-mvp is not shared from the host`. Unset — a
      # compose run on the host — it falls back to `~`, which is what it always was.
      - ${HOST_HOME:-~}/.ds-mvp:/root/.ds-mvp
      - ds-models-flux:/models/flux
      - ds-models-trellis2:/models/trellis2
      - ds-models-cache:/models/hf_cache
    # Add extra_hosts so the container can reach OctoPrint on the host machine.
    # This is needed on Linux; on macOS/Windows it works automatically.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── API Server ──────────────────────────────────────────────────────────────
  api-server:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infra/docker/server.Dockerfile
    image: ds-api-server:latest
    ports:
      # Published on loopback, not on every interface. This server has no
      # authentication at all, so a bare "8000:8000" put POST /jobs (which spends
      # EUR 0,32 on a hosted generation), POST /jobs/{id}/print-dispatch (which
      # heats a nozzle) and PUT /config (which rewrites printer credentials) in
      # reach of anything that can route to this host: the rest of the LAN, a
      # guest network, a shared VPN. DS_API_BIND moves the published address —
      # set it to 0.0.0.0 only when the API is deliberately exposed *and*
      # authenticated. The bind address must stay in this mapping: without one,
      # Docker publishes on every interface again.
      - "${DS_API_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - ${HOST_PROJECT_ROOT:-..}/data/inputs:/app/data/inputs
      - ${HOST_PROJECT_ROOT:-..}/data/outputs:/app/data/outputs
      - ${HOST_PROJECT_ROOT:-..}/data/logs:/app/data/logs
      - ${HOST_PROJECT_ROOT:-..}/pythonsrc:/app/pythonsrc
      - ${HOST_PROJECT_ROOT:-..}/server:/app/server
      - ${HOST_PROJECT_ROOT:-..}/tests:/app/tests
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only, and only so `simulator_manager.octoprint_api_key()` can read the
      # key the simulator boots with. Without it that returns None, Settings' "use
      # simulator" button silently sets the URL and no key, and every call to a
      # simulator that is running perfectly comes back 403.
      - ${HOST_PROJECT_ROOT:-..}/data/octoprint:/app/data/octoprint:ro
      # The config store's Fernet key lives here (~/.ds-mvp/.config_key), the same
      # file the host uses. A bind mount rather than a named volume: a volume is
      # invisible from the host, and that is how a month of job history once went
      # somewhere nobody could see.
      - ${HOST_HOME:-~}/.ds-mvp:/root/.ds-mvp
    env_file:
      # The repository's own `.env`, resolved relative to this file. This is the only
      # thing that reaches the root `.env`: compose's *interpolation* `.env` is looked
      # for beside the compose file, so `${...}` here never saw one. `pipeline-runner`
      # has carried this since it was written; this service's own comment claimed the
      # same file and nothing delivered it, so `make up` started a server with no
      # database at all.
      - path: ../.env
        required: false
    environment:
      - DS_LOGS_DIR=/app/data/logs
      - DOCKER_HOST=unix:///var/run/docker.sock
      - HOST_PROJECT_ROOT=${PWD}
      # The host's home directory, for the same reason as HOST_PROJECT_ROOT: this
      # container runs `docker compose run pipeline-runner`, whose bind mounts are
      # resolved by the daemon against the host's filesystem, and `~` in here is not a
      # path the host has.
      - HOST_HOME=${HOME}
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-ds-mvp}
    depends_on:
      - pipeline-runner
    # The server probes the printer itself (GET /system/printer/status), runs the
    # telemetry collector, and launches run_operator.py in this container — all of
    # which resolve a config-store URL of http://localhost:5001 through
    # `container_reachable_url`. Without this mapping that name does not resolve on
    # Linux, and every probe answers "All connection attempts failed" while the
    # simulator is Operational. pipeline-runner has carried it since it was written.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # `--host 0.0.0.0` is the *container's* interface and must stay as it is.
    # Docker publishes a port by connecting to the container's own address, so a
    # loopback bind in here would make the published port dead however DS_API_BIND
    # is set. Who may reach the server is decided by the bind address in `ports:`
    # above, not by this line.
    command: uvicorn server.app:app --host 0.0.0.0 --port 8000

  # ── Web (build only, for dev) ───────────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    profiles:
      - dev

# ── Named volumes ─────────────────────────────────────────────────────────────
# Volumes persist across container restarts and docker compose down (unless --volumes).
# Delete a model volume to force a fresh download:
#   docker volume rm ds-models-flux
volumes:
  # AI model weights — survive image rebuilds (see .gitignore: *.ckpt, *.safetensors)
  ds-models-flux:
    name: ds-models-flux
  ds-models-trellis2:
    name: ds-models-trellis2
  # Shared HuggingFace cache — avoids re-downloading tokenisers / configs
  ds-models-cache:
    name: ds-models-hf-cache
  # There is deliberately no telemetry volume. The database is bind-mounted from
  # ~/.ds-mvp so it is visible, backup-able, and the same file in every mode.
