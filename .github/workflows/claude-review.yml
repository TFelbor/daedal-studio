# Tier 3 of the Claude Code pipeline: the required check.
#
# The job is named `claude-review` because that string is what you select in
# Settings → Branches → require status checks. Renaming the job silently detaches
# branch protection from this workflow.
#
# The check is red when Fable asks for changes. That is the whole point: a review
# that only ever posts a comment is advice, and advice does not gate a merge. The
# verdict travels out of the model as structured output (`--json-schema`) rather than
# as prose the workflow would have to parse.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # The action exchanges a GitHub OIDC token for the Claude App token. Without
  # this it fails with "Could not fetch an OIDC token" before reaching the model.
  id-token: write

# One review per pull request at a time, and a newer push supersedes an in-flight one.
#
# This is also the answer to issue #125's "claude-review re-runs on every synchronize".
# Measured over every September 2026 run: 331 billed minutes of 2 448, 13,5 % — fourth
# behind `ci.yml` (729), `claude-implement` (677) and `licence-data` (597). The proposed
# saving was to review the incremental diff rather than the whole one, which buys a
# fraction of 13,5 % by making every review after the first read less than the change it
# is approving. **Declined**: this check is what gates a merge, and a reviewer that has
# not seen the whole diff is not the thing branch protection is asserting.
#
# What is taken instead is the free half: a fix pushed three times in a minute collapses
# to one review here, because `cancel-in-progress` cancels the superseded runs. That
# costs no review quality at all — the cancelled run was reviewing a diff that no longer
# exists. 40,7 of those 331 minutes are per-job rounding on runs too short to bill a
# full minute, which nothing in this workflow can recover.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: claude-review
    # A draft is unfinished by declaration. claude-implement's safety net opens one to
    # hold the work of a run that ended early; reviewing it would request changes on
    # a diff nobody claims is done and start the fix loop against it. `ready_for_review`
    # above is the other half: the finished version gets its review when a person
    # says it is finished.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Review with Fable
        id: review
        uses: anthropics/claude-code-action@v1.0.216
        with:
          # `CLAUDE_CODE_OAUTH_TOKEN` is the only auth secret this repository has;
          # `/install-github-app` created it. `anthropic_api_key` is deliberately not
          # passed: an unset secret renders as the empty string, and the action maps
          # that straight onto `ANTHROPIC_API_KEY` in the model's environment, so
          # naming a secret that does not exist sets an empty credential rather than
          # no credential.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The pull requests this workflow exists to review are opened by the Claude
          # app, so `github.actor` on `pull_request` is `claude[bot]` — a Bot, not a
          # User. The action refuses a non-human actor unless it is named here, and it
          # refuses *before* it reaches the model: the step dies in about two seconds
          # with "Workflow initiated by non-human actor: claude (type: Bot)", writes no
          # structured output, and the verdict gate below then correctly fails on a
          # review that never happened. Without this input Tier 3 can never review
          # Tier 2's work, which is the only work it was built to review.
          #
          # The names are matched case-insensitively with a trailing `[bot]` stripped,
          # so these two entries cover all four spellings `CLAUDE_LOGINS` lists.
          # `*` is the form the action's security documentation warns about and is not
          # used: allowed bots are exempt from the write-permission check, so `*` would
          # let any App that can open a pull request choose this job's prompt.
          # `github-actions[bot]` is the actor of every `synchronize` a fix push fires: the
          # fix job pushes with the run's own GITHUB_TOKEN (actions/checkout's persisted
          # credential outranks the App token in the remote URL), so the push is
          # attributed to the workflow, not to the App. Refusing it meant no fix the
          # loop pushed was ever reviewed — PR #92 stayed red on a diff that fixed the
          # review's own finding. The prompt below is fixed by this file, so the actor
          # cannot choose what the reviewer is told; same trust as the `fix` job's list.
          allowed_bots: "claude[bot],claude-code[bot],github-actions[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR against the linked issue's acceptance criteria and CLAUDE.md. Check: criteria met; tests present and meaningful; no changes outside scope; no file containing LEGAL-DEFERRED touched unless the issue says so; no secrets; no new dependencies without a stated reason. Post one review. Approve only if everything passes; otherwise request changes with specific, actionable items.

            Post the review as one top-level PR comment, and use inline comments for
            findings tied to a specific line. Then return your verdict as structured
            output: `verdict` is "approve" or "request_changes", and `summary` is one
            sentence. The verdict decides whether this required check passes, so
            return "request_changes" whenever any check above fails.
          # The transcript above is the durable record; this is the live one, and it is
          # off unless somebody turns it on. Upstream's own warning is why: the input
          # prints *every* message including tool results, "which may contain secrets,
          # API keys, or other sensitive information", into a run log that has no
          # retention limit and is readable by anyone who can read the repository. So it
          # is a lever rather than a setting — `gh variable set CLAUDE_REVIEW_VERBOSE
          # --body on` while chasing a failure, `--body off` after. Same shape as
          # AUTO_MERGE, and for the same reason: how much output a run may print is a
          # decision about this repository, not a line a pull request can change.
          show_full_output: ${{ vars.CLAUDE_REVIEW_VERBOSE == 'on' }}
          # `--max-turns` is not a limiter here, it is a post-hoc budget assertion,
          # and 20 was below what a real review costs. The SDK does not stop at the
          # cap — on PR #55 it ran to completion, returned `subtype: "success"` with
          # `is_error: false`, posted the review comment and three inline comments —
          # and the action then compared the result message's `num_turns` (32) against
          # the cap and threw:
          #
          #   Claude reported a successful result after 32 turns, exceeding the
          #   configured maximum of 20
          #
          # That throw happens in `base-action/src/run-claude-sdk.ts` *before* the
          # block that sets `structured_output`, so a finished, schema-valid review is
          # discarded and the gate below fails on a missing verdict. The check went red
          # on a pull request its reviewer had just approved.
          #
          # The two counters are not the same counter: the SDK's own turn budget did
          # not trip, the result message's `num_turns` did. So the cap has to carry
          # real slack, and it buys no cost control anyway — `timeout-minutes: 20` on
          # the job is the actual bound, and 32 turns took four minutes of it. 80
          # matches claude-implement.yml, which does far more work and fits inside it.
          # `Skill` is what makes `.claude/skills/` reachable. The vendored skills are
          # discovered automatically — the action leaves `settingSources` at
          # `["user","project","local"]`, so the checkout's own skills are indexed —
          # but `--allowedTools` is an allowlist, and without `Skill` on it the model
          # can see every skill's description and invoke none of them. Inert, and
          # invisible in a diff.
          claude_args: |
            --model claude-fable-5-1
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","request_changes"]},"summary":{"type":"string"}},"required":["verdict","summary"]}'

      - name: Keep the transcript
        # The only record of a review that produced no verdict.
        #
        # The action hides the model's turns from the log ("full output hidden for
        # security") and prints a summary of the final result message instead. When
        # that summary is `is_error: true` with `subtype: "success"`, the reason is in
        # the part that was hidden — and it went nowhere, because unlike
        # claude-implement.yml this workflow kept nothing. PR #99's review died in
        # 983 ms at one turn having spent USD 0,00, and the run holds no sentence
        # saying why; PR #98's died at 29 turns having spent USD 2,89, and the run
        # holds no sentence saying why either. Two different failures, one empty log.
        #
        # `if: always()` is the point: this step runs precisely when the verdict is
        # missing, which is the only time the file is worth reading. Fourteen days
        # matches claude-implement.yml, and for its reason — long enough to read after
        # a failure, short enough that a tool result which happened to print an
        # environment does not live forever.
        if: always() && steps.review.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: claude-review-pr-${{ github.event.pull_request.number }}-transcript
          path: ${{ steps.review.outputs.execution_file }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Decide the check from the verdict
        # Three outcomes, and they are three different facts:
        #
        #   a verdict of "approve"          -> green
        #   a verdict of "request_changes"  -> ask for a fix, then red
        #   no verdict at all               -> red, unless the action refused to run
        #
        # That last case is narrow and real. The action validates its own workflow
        # file against the default branch and skips when they differ, which is exactly
        # what happens on a pull request that edits `.github/workflows/`. It logs
        # "Workflow validation failed ... this is normal". Reporting that as a review
        # failure would make the required check permanently red on every pull request
        # that touches this pipeline, and a check that is red for a documented reason
        # is a check people learn to override. So it passes — loudly, saying it was
        # not reviewed and that a human has to read it. The exemption is conditioned
        # on the PR actually changing a workflow file; nothing else earns it.
        #
        # All four outcomes write one sticky comment on the pull request, because
        # "loudly" used to mean the step summary and nothing else. The model posts its
        # own review whenever it runs — so the exemption and the missing verdict, the
        # two paths where it does not run, were the two that reached nobody. See the
        # note on the marker in the script below.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_OUTPUT: ${{ steps.review.outputs.structured_output }}
          MAX_ROUNDS: "3"
          # The logins the Claude GitHub App opens pull requests under, in every
          # spelling `gh` uses for the same actor: `app/claude` as a pull request's
          # `author.login` (GraphQL, `is_bot: true`), `claude` on comments and reviews,
          # `claude[bot]` over REST. PR #92 was declined with "the author is
          # app/claude, not the Claude app" because the first form was missing. The
          # comparison below also normalises the login, so the list is as much a record
          # of the spellings as a gate. claude-automerge.yml carries the same set; the
          # two must not drift (tests/test_claude_pipeline_workflows.py pins both).
          CLAUDE_LOGINS: "claude claude[bot] app/claude claude-code claude-code[bot] app/claude-code"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # One status comment per pull request, edited in place.
          #
          # The outcome used to be written only to the step summary, which is three
          # clicks into the Actions tab. The model posts its own review when it runs at
          # all — so the two paths where it does not run (the workflow-validation
          # exemption, and a review that returns no structured output) were the two that
          # said nothing anywhere a reviewer actually looks. PR #98 and #99 were merged
          # with no verdict and no comment on either page saying so. Every path below
          # now writes this comment, and the step summary keeps its copy.
          #
          # Its marker must not be the fix loop's. `rounds` further down counts comments
          # containing `<!-- claude-fix-request -->`, so a status comment carrying that
          # string would spend the three-round budget by itself and cap the loop before
          # it ever ran.
          STATUS_MARKER='<!-- claude-review-status -->'

          upsert_status() {
            local body id
            body=$(printf '%s\n%s\n\n[claude-review run](%s)\n' "$STATUS_MARKER" "$1" "$RUN_URL")
            # Found by marker, not by author. This comment is written with GITHUB_TOKEN,
            # and `gh pr comment --edit-last` edits whatever that actor last wrote — on a
            # pull request that got a fix request, that is the fix request.
            id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
                   --jq ".[] | select(.body | startswith(\"${STATUS_MARKER}\")) | .id" \
                 2>/dev/null | head -n 1) || id=""
            # Neither branch may change this step's exit code. The verdict decides the
            # check; a comment that failed to post is a reporting failure, and turning
            # an approval red because GitHub returned 502 would be the worse bug.
            if [ -n "$id" ]; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" \
                -f body="$body" >/dev/null \
                || echo "::warning::could not update the claude-review status comment"
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                -f body="$body" >/dev/null \
                || echo "::warning::could not post the claude-review status comment"
            fi
          }

          if [ -z "$REVIEW_OUTPUT" ]; then
            touched=$(gh pr view "$PR_NUMBER" --json files \
              --jq '[.files[].path | select(startswith(".github/workflows/"))] | length')
            if [ "$touched" -gt 0 ]; then
              {
                echo "### claude-review did not run"
                echo ""
                echo "This pull request changes \`.github/workflows/\`, and the action refuses to"
                echo "run a workflow version that differs from the default branch."
                echo ""
                echo "**Nothing reviewed this pull request. A human has to read it.**"
              } >> "$GITHUB_STEP_SUMMARY"
              upsert_status "$(printf '%s\n\n%s\n\n%s' \
                '**claude-review did not run. Nothing reviewed this pull request.**' \
                'It changes `.github/workflows/`, and the action refuses to run a workflow version that differs from the default branch. The check is green deliberately: the alternative is a required check that is permanently red on every pull request touching the pipeline, and a check that is red for a documented reason is one people learn to override.' \
                '**A human has to read this one.** The workflow starts reviewing normally again once this is merged.')"
              echo "Review skipped: this PR changes workflow files."
              exit 0
            fi
            upsert_status "$(printf '%s\n\n%s\n\n%s' \
              '**claude-review returned no verdict. Nothing reviewed this pull request.**' \
              'The review step ran and produced no structured output, so there was nothing to gate on. This is not a rejection — it is a review that did not happen, and the red check means only that. Two known causes look identical from here and are told apart by the transcript artifact on the run (`gh run download <run-id>`): a review that lost its verdict at the end, and one that never reached the model at all.' \
              '**Rerun the check (`gh run rerun <run-id> --failed`) or read the diff yourself. Do not read this as an approval.**')"
            echo "The review step returned no structured output, so there is no verdict to gate on." >&2
            exit 1
          fi

          verdict=$(printf '%s' "$REVIEW_OUTPUT" | jq -r '.verdict')
          summary=$(printf '%s' "$REVIEW_OUTPUT" | jq -r '.summary')
          echo "verdict=${verdict}"
          echo "summary=${summary}"

          if [ "$verdict" = "approve" ]; then
            echo "claude-review approved this pull request." >> "$GITHUB_STEP_SUMMARY"
            upsert_status "$(printf '%s\n\n%s' '**claude-review approved this pull request.**' "$summary")"
            exit 0
          fi

          # Section 4e's fix loop. The comment is what re-enters claude-implement.yml's
          # interactive `fix` job. The round cap is in the repository as well as in the
          # Dispatcher because the loop closes here — a fix pushes, `synchronize` fires,
          # this workflow runs again — and a cap that lives only in a process outside
          # the repository does not stop a runaway that starts inside it.
          #
          # Two preconditions guard the comment itself, both learned from a live misfire
          # on merged PR #52:
          #
          #   The pull request must still be open. A review is queued at `opened` and
          #   lands minutes later; when a human merges inside that window, the fix
          #   request has nowhere to push — it summons Opus to spend a 60-minute job
          #   budget editing a branch already in main. #52 got exactly that comment
          #   two seconds after the review, and the `fix` job ran on it.
          #
          #   The pull request must be the Claude app's own. This loop exists so the
          #   implementer can answer its reviewer. On a human's pull request it is not
          #   a loop, it is an unsolicited @-mention that would have Opus push to a
          #   contributor's branch uninvited.
          #
          # Neither precondition changes the check's colour. The verdict is what gates
          # the merge, and "request_changes, and nobody was asked to fix it" is still
          # request_changes — a red check a human then reads.
          marker='<!-- claude-fix-request -->'

          pr_meta=$(gh pr view "$PR_NUMBER" --json state,author)
          pr_state=$(printf '%s' "$pr_meta" | jq -r '.state')
          pr_author=$(printf '%s' "$pr_meta" | jq -r '.author.login')
          # One App, three spellings (see CLAUDE_LOGINS). Strip the `app/` prefix and the
          # `[bot]` suffix before comparing: neither `/` nor `[` is legal in a human
          # login, so the normalisation cannot let a person through.
          pr_author_norm=$(printf '%s' "$pr_author" | sed -E 's#^app/##; s#\[bot\]$##')

          ask=true
          if [ "$pr_state" != "OPEN" ]; then
            reason="the pull request is ${pr_state}"
            ask=false
          else
            case " $CLAUDE_LOGINS " in
              *" $pr_author_norm "*) : ;;
              *) reason="the author is ${pr_author}, not the Claude app"; ask=false ;;
            esac
          fi

          if [ "$ask" = "false" ]; then
            echo "Not asking for a fix: ${reason}."
            {
              echo "claude-review requested changes, and did not ask for a fix:"
              echo "${reason}."
              echo ""
              echo "${summary}"
            } >> "$GITHUB_STEP_SUMMARY"
            upsert_status "$(printf '%s\n\n%s\n\n%s' \
              '**claude-review requested changes.**' \
              "$summary" \
              "No fix was requested, because ${reason}. Read the review above.")"
            exit 1
          fi

          rounds=$(gh pr view "$PR_NUMBER" --json comments \
            --jq "[.comments[] | select(.body | contains(\"${marker}\"))] | length")
          echo "fix rounds so far: ${rounds}"

          if [ "$rounds" -lt "$MAX_ROUNDS" ]; then
            fix_note=$(printf 'Asked the implementer to address it — round %s of %s.' \
              "$((rounds + 1))" "$MAX_ROUNDS")
            body=$(printf '%s\n@claude please address the review.\n\nRound %s of %s. Latest verdict: %s\n' \
              "$marker" "$((rounds + 1))" "$MAX_ROUNDS" "$summary")
          else
            fix_note=$(printf 'Changes have been requested %s times, which is the cap. Not asking again — a human needs to look at this one.' \
              "$rounds")
            body=$(printf '%s\nReview has requested changes %s times, which is the cap. Not asking again — a human needs to look at this one.\n\nLatest verdict: %s\n' \
              "$marker" "$rounds" "$summary")
          fi
          gh pr comment "$PR_NUMBER" --body "$body"

          {
            echo "claude-review requested changes."
            echo ""
            echo "${summary}"
          } >> "$GITHUB_STEP_SUMMARY"
          upsert_status "$(printf '%s\n\n%s\n\n%s' \
            '**claude-review requested changes.**' \
            "$summary" \
            "$fix_note")"
          exit 1
