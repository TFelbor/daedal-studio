# Tier 3 of the Claude Code pipeline: the required check.
#
# The job is named `claude-review` because that string is what you select in
# Settings → Branches → require status checks. Renaming the job silently detaches
# branch protection from this workflow.
#
# The check is red when Fable asks for changes. That is the whole point: a review
# that only ever posts a comment is advice, and advice does not gate a merge. The
# verdict travels out of the model as structured output (`--json-schema`) rather than
# as prose the workflow would have to parse.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # The action exchanges a GitHub OIDC token for the Claude App token. Without
  # this it fails with "Could not fetch an OIDC token" before reaching the model.
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: claude-review
    # A draft is unfinished by declaration. claude-implement's safety net opens one to
    # hold the work of a run that ended early; reviewing it would request changes on
    # a diff nobody claims is done and start the fix loop against it. `ready_for_review`
    # above is the other half: the finished version gets its review when a person
    # says it is finished.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Review with Fable
        id: review
        uses: anthropics/claude-code-action@v1.0.216
        with:
          # `CLAUDE_CODE_OAUTH_TOKEN` is the only auth secret this repository has;
          # `/install-github-app` created it. `anthropic_api_key` is deliberately not
          # passed: an unset secret renders as the empty string, and the action maps
          # that straight onto `ANTHROPIC_API_KEY` in the model's environment, so
          # naming a secret that does not exist sets an empty credential rather than
          # no credential.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The pull requests this workflow exists to review are opened by the Claude
          # app, so `github.actor` on `pull_request` is `claude[bot]` — a Bot, not a
          # User. The action refuses a non-human actor unless it is named here, and it
          # refuses *before* it reaches the model: the step dies in about two seconds
          # with "Workflow initiated by non-human actor: claude (type: Bot)", writes no
          # structured output, and the verdict gate below then correctly fails on a
          # review that never happened. Without this input Tier 3 can never review
          # Tier 2's work, which is the only work it was built to review.
          #
          # The names are matched case-insensitively with a trailing `[bot]` stripped,
          # so these two entries cover all four spellings `CLAUDE_LOGINS` lists.
          # `*` is the form the action's security documentation warns about and is not
          # used: allowed bots are exempt from the write-permission check, so `*` would
          # let any App that can open a pull request choose this job's prompt.
          allowed_bots: "claude[bot],claude-code[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR against the linked issue's acceptance criteria and CLAUDE.md. Check: criteria met; tests present and meaningful; no changes outside scope; no file containing LEGAL-DEFERRED touched unless the issue says so; no secrets; no new dependencies without a stated reason. Post one review. Approve only if everything passes; otherwise request changes with specific, actionable items.

            Post the review as one top-level PR comment, and use inline comments for
            findings tied to a specific line. Then return your verdict as structured
            output: `verdict` is "approve" or "request_changes", and `summary` is one
            sentence. The verdict decides whether this required check passes, so
            return "request_changes" whenever any check above fails.
          # `--max-turns` is not a limiter here, it is a post-hoc budget assertion,
          # and 20 was below what a real review costs. The SDK does not stop at the
          # cap — on PR #55 it ran to completion, returned `subtype: "success"` with
          # `is_error: false`, posted the review comment and three inline comments —
          # and the action then compared the result message's `num_turns` (32) against
          # the cap and threw:
          #
          #   Claude reported a successful result after 32 turns, exceeding the
          #   configured maximum of 20
          #
          # That throw happens in `base-action/src/run-claude-sdk.ts` *before* the
          # block that sets `structured_output`, so a finished, schema-valid review is
          # discarded and the gate below fails on a missing verdict. The check went red
          # on a pull request its reviewer had just approved.
          #
          # The two counters are not the same counter: the SDK's own turn budget did
          # not trip, the result message's `num_turns` did. So the cap has to carry
          # real slack, and it buys no cost control anyway — `timeout-minutes: 20` on
          # the job is the actual bound, and 32 turns took four minutes of it. 80
          # matches claude-implement.yml, which does far more work and fits inside it.
          # `Skill` is what makes `.claude/skills/` reachable. The vendored skills are
          # discovered automatically — the action leaves `settingSources` at
          # `["user","project","local"]`, so the checkout's own skills are indexed —
          # but `--allowedTools` is an allowlist, and without `Skill` on it the model
          # can see every skill's description and invoke none of them. Inert, and
          # invisible in a diff.
          claude_args: |
            --model claude-fable-5-1
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","request_changes"]},"summary":{"type":"string"}},"required":["verdict","summary"]}'

      - name: Decide the check from the verdict
        # Three outcomes, and they are three different facts:
        #
        #   a verdict of "approve"          -> green
        #   a verdict of "request_changes"  -> ask for a fix, then red
        #   no verdict at all               -> red, unless the action refused to run
        #
        # That last case is narrow and real. The action validates its own workflow
        # file against the default branch and skips when they differ, which is exactly
        # what happens on a pull request that edits `.github/workflows/`. It logs
        # "Workflow validation failed ... this is normal". Reporting that as a review
        # failure would make the required check permanently red on every pull request
        # that touches this pipeline, and a check that is red for a documented reason
        # is a check people learn to override. So it passes — loudly, saying it was
        # not reviewed and that a human has to read it. The exemption is conditioned
        # on the PR actually changing a workflow file; nothing else earns it.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_OUTPUT: ${{ steps.review.outputs.structured_output }}
          MAX_ROUNDS: "3"
          # The logins the Claude GitHub App opens pull requests under. `gh --json`
          # reads GraphQL, where a GitHub App's login is the bare slug (`claude`);
          # only REST spells it `claude[bot]`. Both forms are listed because this set
          # is duplicated in claude-automerge.yml and the two must not drift.
          CLAUDE_LOGINS: "claude claude[bot] claude-code claude-code[bot]"
        run: |
          set -euo pipefail

          if [ -z "$REVIEW_OUTPUT" ]; then
            touched=$(gh pr view "$PR_NUMBER" --json files \
              --jq '[.files[].path | select(startswith(".github/workflows/"))] | length')
            if [ "$touched" -gt 0 ]; then
              {
                echo "### claude-review did not run"
                echo ""
                echo "This pull request changes \`.github/workflows/\`, and the action refuses to"
                echo "run a workflow version that differs from the default branch."
                echo ""
                echo "**Nothing reviewed this pull request. A human has to read it.**"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Review skipped: this PR changes workflow files."
              exit 0
            fi
            echo "The review step returned no structured output, so there is no verdict to gate on." >&2
            exit 1
          fi

          verdict=$(printf '%s' "$REVIEW_OUTPUT" | jq -r '.verdict')
          summary=$(printf '%s' "$REVIEW_OUTPUT" | jq -r '.summary')
          echo "verdict=${verdict}"
          echo "summary=${summary}"

          if [ "$verdict" = "approve" ]; then
            echo "claude-review approved this pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Section 4e's fix loop. The comment is what re-enters claude-implement.yml's
          # interactive `fix` job. The round cap is in the repository as well as in the
          # Dispatcher because the loop closes here — a fix pushes, `synchronize` fires,
          # this workflow runs again — and a cap that lives only in a process outside
          # the repository does not stop a runaway that starts inside it.
          #
          # Two preconditions guard the comment itself, both learned from a live misfire
          # on merged PR #52:
          #
          #   The pull request must still be open. A review is queued at `opened` and
          #   lands minutes later; when a human merges inside that window, the fix
          #   request has nowhere to push — it summons Opus to spend a 60-minute job
          #   budget editing a branch already in main. #52 got exactly that comment
          #   two seconds after the review, and the `fix` job ran on it.
          #
          #   The pull request must be the Claude app's own. This loop exists so the
          #   implementer can answer its reviewer. On a human's pull request it is not
          #   a loop, it is an unsolicited @-mention that would have Opus push to a
          #   contributor's branch uninvited.
          #
          # Neither precondition changes the check's colour. The verdict is what gates
          # the merge, and "request_changes, and nobody was asked to fix it" is still
          # request_changes — a red check a human then reads.
          marker='<!-- claude-fix-request -->'

          pr_meta=$(gh pr view "$PR_NUMBER" --json state,author)
          pr_state=$(printf '%s' "$pr_meta" | jq -r '.state')
          pr_author=$(printf '%s' "$pr_meta" | jq -r '.author.login')

          ask=true
          if [ "$pr_state" != "OPEN" ]; then
            reason="the pull request is ${pr_state}"
            ask=false
          else
            case " $CLAUDE_LOGINS " in
              *" $pr_author "*) : ;;
              *) reason="the author is ${pr_author}, not the Claude app"; ask=false ;;
            esac
          fi

          if [ "$ask" = "false" ]; then
            echo "Not asking for a fix: ${reason}."
            {
              echo "claude-review requested changes, and did not ask for a fix:"
              echo "${reason}."
              echo ""
              echo "${summary}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          rounds=$(gh pr view "$PR_NUMBER" --json comments \
            --jq "[.comments[] | select(.body | contains(\"${marker}\"))] | length")
          echo "fix rounds so far: ${rounds}"

          if [ "$rounds" -lt "$MAX_ROUNDS" ]; then
            body=$(printf '%s\n@claude please address the review.\n\nRound %s of %s. Latest verdict: %s\n' \
              "$marker" "$((rounds + 1))" "$MAX_ROUNDS" "$summary")
          else
            body=$(printf '%s\nReview has requested changes %s times, which is the cap. Not asking again — a human needs to look at this one.\n\nLatest verdict: %s\n' \
              "$marker" "$rounds" "$summary")
          fi
          gh pr comment "$PR_NUMBER" --body "$body"

          {
            echo "claude-review requested changes."
            echo ""
            echo "${summary}"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
