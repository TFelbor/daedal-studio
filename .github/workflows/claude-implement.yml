# Tier 2 of the Claude Code pipeline: turn a labelled issue into a pull request.
#
# Two jobs, both writing code, entered from opposite directions:
#
#   `implement` — an issue gains `plan-ready` (it went through claude-plan) or
#     `tier:opus-direct` (the Dispatcher judged it unambiguous), or someone runs the
#     workflow by hand for one issue. Runs in automation mode, because a `prompt`
#     input is set.
#   `fix` — someone, usually claude-review.yml, comments `@claude ...` on a PR. Runs
#     in interactive mode, because no `prompt` input is set. This is the fix loop of
#     Section 4e; it lives here rather than in a fifth file because it is the same
#     capability — Opus editing the tree — reached by a different trigger.
#
# Both jobs build the environment ci.yml builds, because CLAUDE.md's test command is
# `pytest tests/` and that suite needs a PostgreSQL, a CuraEngine on PATH and a
# `pythonsrc/config.py`. A PR opened without the tests having run is a PR that spends
# a review round finding out.
#
# Both jobs end the same way whatever the model did: the transcript is kept as an
# artifact, and infra/ci/claude_implement_report.sh pushes what was committed, opens
# a draft pull request when there is none, and tells the issue what happened. The
# first real run to hit its turn budget (issue #60: 81 turns, USD 9,44, nothing
# pushed) left nothing but a red run in the Actions tab; that is the failure this
# tail exists to make impossible. See docs/PIPELINE.md § When a run fails.
name: claude-implement

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  # One issue, by hand: to retry a failed run without the remove-and-re-add label
  # dance, or to run the implementer on demand. The issue must still carry `claude`
  # — "without it nothing runs" holds for this trigger too (see the Resolve step).
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue to implement. It must carry the `claude` label."
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

# Applying `claude`, `tier:opus-direct` and `risk:review` is three `labeled` events
# within a second of each other, and each one satisfies the `if` below once the
# previous label is already on the issue. Serialising per issue lets the PR-exists
# guard in the first run be true by the time the second run reaches it. A dispatched
# run keys on the same number, so it queues behind a labelled one for the same issue.
concurrency:
  group: claude-implement-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  implement:
    name: implement
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       contains(github.event.issue.labels.*.name, 'claude') &&
       (contains(github.event.issue.labels.*.name, 'plan-ready') ||
        contains(github.event.issue.labels.*.name, 'tier:opus-direct')))
    runs-on: ubuntu-latest
    # The real cost bound. 200 turns at the measured pace (81 turns in 12,5 minutes on
    # #60) is about half an hour of model time after a five-minute install; the rest
    # is slack for test runs. `--max-turns` below is a runaway guard, not this.
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Phase 2's hosted backend bills EUR 0,32 a generation and selects itself from
      # $PIXAZO_API_KEY. Same guard ci.yml carries, for the same reason.
      DS_DISABLE_PAID_BACKENDS: "1"
      DS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve the issue
        id: issue
        # One place that knows which issue this run is about, whichever trigger fired.
        # It also re-checks the `claude` label: the job-level `if` cannot, on
        # `workflow_dispatch`, and an issue without that label is one the pipeline has
        # been told to leave alone.
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ github.event.inputs.issue_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then n="$INPUT_ISSUE"; else n="$EVENT_ISSUE"; fi
          [[ "$n" =~ ^[0-9]+$ ]] || { echo "::error::'$n' is not an issue number"; exit 1; }
          meta=$(gh issue view "$n" --json number,title,state,labels)
          state=$(jq -r '.state' <<<"$meta")
          labels=$(jq -r '.labels[].name' <<<"$meta")
          if ! grep -qx 'claude' <<<"$labels"; then
            echo "::error::Issue #$n does not carry the 'claude' label; nothing runs without it."
            exit 1
          fi
          if [ "$state" != "OPEN" ]; then
            echo "::error::Issue #$n is $state, not open."
            exit 1
          fi
          risk=$(grep -m1 '^risk:' <<<"$labels" || true)
          {
            echo "number=$n"
            echo "risk=$risk"
            echo "title<<TITLE_EOF"
            jq -r '.title' <<<"$meta"
            echo "TITLE_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Issue #$n (${risk:-no risk label})."

      - name: Skip if a pull request already exists for this issue
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail

          # Two questions, and only the first one is authoritative.
          #
          # `claude/issue-<n>` is the branch the implementer below works on, so a ready
          # or merged pull request from that head is the definitive "already done". A
          # *closed* one is an abandoned attempt — the draft the safety net opened, say,
          # closed by a person who wants a fresh start — and must not block that start.
          # GitHub filters it server-side and returns a few small nodes.
          #
          # The body scan is a courtesy for a pull request a human opened by hand with
          # "#<n>" in the body — and it is the query that broke. Selecting `body` with
          # `--limit 100` asks GitHub's GraphQL API for a hundred full pull-request
          # bodies in a single request, and it answered
          #
          #   GraphQL: Something went wrong while executing your query ...
          #   (repository.pullRequests.nodes.10)
          #
          # on run after run. Under `set -e` that killed the step at exit 1, and the job
          # never reached the model: every claude-implement failure before #60 was this
          # line, not a missing permission, a missing tool allowance or the label
          # filter. So it retries, asks for fewer bodies, and treats a persistent failure
          # as a warning rather than the end of the run — the branch query already covers
          # the duplicate this guard exists to prevent, and losing a heuristic to a
          # transient API error must not cost a labelled issue its implementation.
          gh_retry() {
            local out attempt
            for attempt in 1 2 3; do
              if out=$("$@" 2>&1); then
                printf '%s' "$out"
                return 0
              fi
              echo "attempt ${attempt} failed: ${out}" >&2
              sleep $((attempt * 3))
            done
            return 1
          }

          # The safety net's draft (see infra/ci/claude_implement_report.sh) is the one
          # pull request that means "not done": an earlier run ended before it finished
          # and left its commits here. That run is resumed — the branch step checks the
          # branch out from origin and the note below tells the model — rather than
          # skipped. A draft *without* the marker is the model's own or a person's, and
          # is left alone; a ready pull request or a merged one means done.
          open_prs=$(gh_retry gh pr list --state open --limit 10 \
            --head "claude/issue-${ISSUE_NUMBER}" --json number,isDraft,body) || {
            echo "Could not ask GitHub whether a pull request already exists for #${ISSUE_NUMBER}." >&2
            echo "Refusing to implement blind: a duplicate costs a full run of Opus." >&2
            exit 1
          }
          merged=$(gh_retry gh pr list --state merged --limit 5 \
            --head "claude/issue-${ISSUE_NUMBER}" --json number --jq 'length') || {
            echo "Could not ask GitHub whether a pull request was already merged for #${ISSUE_NUMBER}." >&2
            exit 1
          }
          # Both markers the pipeline opens a draft with: the safety net's, and the
          # draft-first draft the implementer opens as its first action. A draft
          # carrying either is *ours* — resumable; anything else is somebody else's and
          # blocks the issue. Matching the safety net alone made a draft-first draft
          # read as foreign, which set `existing=1` and turned both `claude-resume` and
          # a manual dispatch into a no-op run for that issue until a person closed the
          # draft. `tests/test_claude_resume.py` binds this pattern to both markers.
          ours='<!-- claude-implement-(safety-net|draft-first)'
          ready=$(jq '[.[] | select(.isDraft | not)] | length' <<<"$open_prs")
          foreign_drafts=$(jq --arg ours "$ours" '[.[] | select(.isDraft and (((.body // "") | test($ours)) | not))] | length' <<<"$open_prs")
          resume_pr=$(jq -r --arg ours "$ours" '[.[] | select(.isDraft and ((.body // "") | test($ours)))] | .[0].number // empty' <<<"$open_prs")

          if [ "$merged" -gt 0 ] || [ "$ready" -gt 0 ] || [ "$foreign_drafts" -gt 0 ]; then
            existing=1
          elif [ -n "$resume_pr" ]; then
            echo "Draft pull request #${resume_pr} was opened by the safety net; resuming the branch behind it."
            note="This branch already holds commits from an earlier run that ended before it finished; draft pull request #${resume_pr} describes how that run ended. Read the issue, the Plan comment if there is one, the draft's description and its comments, then \`git log --oneline origin/main..HEAD\` and \`git diff origin/main\` before changing anything, and continue from where it stopped — do not start over. When every acceptance criterion is met, update the pull request body with the ticked checklist and mark it ready with \`gh pr ready ${resume_pr}\`."
            {
              echo "resume_note=${note}"
              echo "resume_pr=${resume_pr}"
              echo "should_run=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          else
            existing=0
          fi

          if [ "$existing" -eq 0 ]; then
            by_body=$(gh_retry gh pr list --state open --limit 50 --json body \
              --jq "[.[] | select((.body // \"\") | test(\"(^|[^0-9])#${ISSUE_NUMBER}([^0-9]|\$)\"))] | length") \
              || by_body=""
            if [ -z "$by_body" ]; then
              echo "::warning::The body scan for '#${ISSUE_NUMBER}' failed three times; relying on the branch check alone."
            else
              existing="$by_body"
            fi
          fi

          if [ "$existing" -gt 0 ]; then
            echo "A pull request already references issue #${ISSUE_NUMBER}; not implementing again."
            should_run=false
          else
            should_run=true
          fi
          {
            echo "resume_note="
            echo "resume_pr="
            echo "should_run=${should_run}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.should_run == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-base.txt

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.should_run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Provide a CuraEngine stand-in
        # `CuraSlicer.__init__` refuses to construct without the binary on PATH, and
        # nothing in the default test selection executes it. Same stand-in as ci.yml.
        if: steps.guard.outputs.should_run == 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          install -m 755 infra/ci/curaengine_stub.sh "$HOME/.local/bin/CuraEngine"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-base.txt
          cp pythonsrc/config.template.py pythonsrc/config.py
          mkdir -p data/inputs data/outputs data/logs
          npm --prefix web ci

      - name: Create or resume the working branch
        id: branch
        # The action creates a branch only in tag mode. With a `prompt` input it runs
        # in automation mode, where `branch_name_template` is read by nothing
        # (src/modes/agent/index.ts at v1.0.216 never calls setupBranch), so the model
        # used to spend its first turns on git plumbing and the branch was whatever it
        # chose to call it. A previous attempt's branch is resumed, not replaced: its
        # commits are the work, and the guard above has already said no open or merged
        # pull request claims them.
        if: steps.guard.outputs.should_run == 'true'
        env:
          BRANCH: claude/issue-${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch -q origin "$BRANCH"
            git checkout -q -B "$BRANCH" "origin/$BRANCH"
            echo "resumed=true" >> "$GITHUB_OUTPUT"
            echo "Resumed $BRANCH from origin, $(git rev-list --count origin/main..HEAD) commit(s) ahead of main."
          else
            git checkout -q -b "$BRANCH"
            echo "resumed=false" >> "$GITHUB_OUTPUT"
            echo "Created $BRANCH from $(git rev-parse --short HEAD)."
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Implement with Opus
        id: implement
        if: steps.guard.outputs.should_run == 'true'
        uses: anthropics/claude-code-action@v1.0.216
        env:
          # What the action reports as `branch_name` in automation mode; it is what the
          # step above checked out.
          CLAUDE_BRANCH: ${{ steps.branch.outputs.name }}
        with:
          # `CLAUDE_CODE_OAUTH_TOKEN` is the only auth secret this repository has;
          # `/install-github-app` created it. `anthropic_api_key` is deliberately not
          # passed: an unset secret renders as the empty string, and the action maps
          # that straight onto `ANTHROPIC_API_KEY` in the model's environment, so
          # naming a secret that does not exist sets an empty credential rather than
          # no credential.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # `claude-plan` adds `plan-ready` with the Claude App's token, so on the
          # plan-first tier the `labeled` event that starts this job is sent by
          # `claude[bot]`, and the action refuses a bot actor it is not told about —
          # before the model runs, in about two seconds. Same list as claude-review.yml,
          # for the same bot. `github-actions[bot]` is claude-resume.yml re-dispatching
          # this workflow with the workflow token — the same trust the `fix` job already
          # extends to it. Never `*`: an allowed bot skips the write-permission check.
          allowed_bots: "claude[bot],claude-code[bot],github-actions[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ steps.issue.outputs.number }}

            You are on the branch `${{ steps.branch.outputs.name }}`, already created and checked out for you. Do not create another branch. Implement this issue on it. If a "Plan" comment exists on the issue, follow it. Follow CLAUDE.md.

            ${{ steps.guard.outputs.resume_note }}

            Work in small commits, and push after every commit (`git push -u origin HEAD` the first time). A run that ends early keeps everything that was pushed and loses everything that was not.

            Add or update tests so every acceptance criterion is covered. While iterating, run only the tests you are touching; run the full `pytest tests/` and `npm --prefix web run build` once, before opening the pull request, and make them pass.

            Unless the note above already names a pull request to continue, your **first action on this branch, before you change any file**, is to open a draft pull request with `gh pr create --draft`: it references this issue, copies its acceptance criteria into the body as an unticked checklist, carries the issue's `risk:*` label, and contains the line `<!-- claude-implement-draft-first -->`. Open it first because nothing that runs after your turns are gone can open one — the token the tail falls back to is refused `createPullRequest` by organisation policy — so a branch with no pull request is work nobody finds. Then implement.

            Tick each criterion with `gh pr edit` as you verify it. When every one is ticked and the full suite and the web build pass, mark it ready with `gh pr ready`. Keep the pull request to this task only; if you cannot finish, leave it a draft whose body says what remains.
          # `Skill` is on the allowlist so the vendored `.claude/skills/` are reachable;
          # without it the model sees their descriptions and can invoke none of them.
          # See docs/PIPELINE.md § Skills are vendored, not installed.
          #
          # `--max-turns` is a runaway guard with slack, not a measured figure: a
          # README-only task (#53) took 32 turns, and a Size L issue (#60) exhausted 80
          # before a pull request existed. `timeout-minutes` above is the cost bound.
          claude_args: |
            --model claude-opus-5
            --max-turns 200
            --allowedTools "Read,Glob,Grep,Skill,Edit,MultiEdit,Write,Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr ready:*),Bash(pytest:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(npm:*),Bash(make:*)"

      - name: Keep the transcript
        # The action hides the model's turns from the log, so the execution file is the
        # only record of where a turn budget went. Kept on success and failure alike —
        # a transcript is only useful when nobody expected to need it. Fourteen days:
        # long enough to read after a failure, short enough that a tool result which
        # happened to print an environment does not live forever.
        if: always() && steps.guard.outputs.should_run == 'true' && steps.implement.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: claude-implement-issue-${{ steps.issue.outputs.number }}-transcript
          path: ${{ steps.implement.outputs.execution_file }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Leave the work where a person can find it
        # See the script's header. `if: always()` is the point: this runs precisely when
        # the model step failed, which is when nothing else would report.
        if: always() && steps.guard.outputs.should_run == 'true'
        env:
          # The App's token when the action produced one, so a draft this opens is the
          # Claude app's — which is what lets claude-review's fix loop ask for changes
          # on it. The workflow token is the fallback; a draft opened with it is still a
          # draft with a URL.
          GH_TOKEN: ${{ steps.implement.outputs.github_token || github.token }}
          # The `||` above can only notice an *absent* token, and the App's is present
          # and revoked by the time this step runs — see select_token in the script. On
          # issue #65 that cost the run its draft pull request and its issue comment,
          # both to `HTTP 401`, with nothing red to show for it.
          GH_TOKEN_FALLBACK: ${{ github.token }}
          MODE: implement
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          RISK_LABEL: ${{ steps.issue.outputs.risk }}
          BRANCH: ${{ steps.branch.outputs.name }}
          BASE_BRANCH: main
          CONCLUSION: ${{ steps.implement.outcome }}
          EXECUTION_FILE: ${{ steps.implement.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash infra/ci/claude_implement_report.sh

  fix:
    name: fix
    # The fix loop. `issue_comment` also fires on plain issues, so the pull_request
    # clause is what keeps this to PRs. No `prompt` input below: that is what selects
    # the action's interactive mode, which reads the @claude comment as the request.
    #
    # The state clauses are the second half of claude-review.yml's fix-loop guard, held
    # here as well because this job answers *any* @claude comment, not only the
    # reviewer's. A merged pull request has nowhere to push a fix to, and this job
    # carries a long timeout, a PostgreSQL service and a full dependency install
    # before it reaches the model — the cost of answering is paid whether or not the
    # answer can land. Merged PR #52 was asked, and this job ran on it.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.issue.pull_request.merged_at == null &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DS_DISABLE_PAID_BACKENDS: "1"
      DS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-base.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Provide a CuraEngine stand-in
        run: |
          mkdir -p "$HOME/.local/bin"
          install -m 755 infra/ci/curaengine_stub.sh "$HOME/.local/bin/CuraEngine"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-base.txt
          cp pythonsrc/config.template.py pythonsrc/config.py
          mkdir -p data/inputs data/outputs data/logs
          npm --prefix web ci

      - name: Address the review with Opus
        id: fix
        uses: anthropics/claude-code-action@v1.0.216
        with:
          # `CLAUDE_CODE_OAUTH_TOKEN` is the only auth secret this repository has;
          # `/install-github-app` created it. `anthropic_api_key` is deliberately not
          # passed: an unset secret renders as the empty string, and the action maps
          # that straight onto `ANTHROPIC_API_KEY` in the model's environment, so
          # naming a secret that does not exist sets an empty credential rather than
          # no credential.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # claude-review.yml posts its fix request with the workflow token, so the
          # comment's author is github-actions[bot]. The action refuses bot authors
          # unless they are named here, and `*` is the form the security docs warn
          # about. This repository is private and only the two technical co-founders
          # can push, which is what makes naming one bot acceptable.
          allowed_bots: "github-actions[bot]"
          # `Skill` is on the allowlist so the vendored `.claude/skills/` are reachable;
          # without it the model sees their descriptions and can invoke none of them.
          # See docs/PIPELINE.md § Skills are vendored, not installed.
          claude_args: |
            --model claude-opus-5
            --max-turns 200
            --allowedTools "Read,Glob,Grep,Skill,Edit,MultiEdit,Write,Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr ready:*),Bash(gh issue view:*),Bash(pytest:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(npm:*),Bash(make:*)"

      - name: Keep the transcript
        if: always() && steps.fix.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: claude-implement-fix-pr-${{ github.event.issue.number }}-run-${{ github.run_id }}-transcript
          path: ${{ steps.fix.outputs.execution_file }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Leave the work where a person can find it
        # Same tail as the implement job, in fix mode: push what was committed to the
        # pull request's branch, and say on the pull request how the run ended. The
        # branch is whatever the action checked out, which the script reads from HEAD.
        if: always()
        env:
          GH_TOKEN: ${{ steps.fix.outputs.github_token || github.token }}
          # Same revoked-token hazard as the `implement` job's report step above.
          GH_TOKEN_FALLBACK: ${{ github.token }}
          MODE: fix
          PR_NUMBER: ${{ github.event.issue.number }}
          BASE_BRANCH: main
          CONCLUSION: ${{ steps.fix.outcome }}
          EXECUTION_FILE: ${{ steps.fix.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash infra/ci/claude_implement_report.sh
