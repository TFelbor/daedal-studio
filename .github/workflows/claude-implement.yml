# Tier 2 of the Claude Code pipeline: turn a labelled issue into a pull request.
#
# Two jobs, both writing code, entered from opposite directions:
#
#   `implement` — an issue gains `plan-ready` (it went through claude-plan) or
#     `tier:opus-direct` (the Dispatcher judged it unambiguous). Runs in automation
#     mode, because a `prompt` input is set.
#   `fix` — someone, usually claude-review.yml, comments `@claude ...` on a PR. Runs
#     in interactive mode, because no `prompt` input is set. This is the fix loop of
#     Section 4e; it lives here rather than in a fifth file because it is the same
#     capability — Opus editing the tree — reached by a different trigger.
#
# Both jobs build the environment ci.yml builds, because CLAUDE.md's test command is
# `pytest tests/` and that suite needs a PostgreSQL, a CuraEngine on PATH and a
# `pythonsrc/config.py`. A PR opened without the tests having run is a PR that spends
# a review round finding out.
name: claude-implement

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

# Applying `claude`, `tier:opus-direct` and `risk:review` is three `labeled` events
# within a second of each other, and each one satisfies the `if` below once the
# previous label is already on the issue. Serialising per issue lets the PR-exists
# guard in the first run be true by the time the second run reaches it.
concurrency:
  group: claude-implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    name: implement
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'claude') &&
      (contains(github.event.issue.labels.*.name, 'plan-ready') ||
       contains(github.event.issue.labels.*.name, 'tier:opus-direct'))
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Phase 2's hosted backend bills EUR 0,32 a generation and selects itself from
      # $PIXAZO_API_KEY. Same guard ci.yml carries, for the same reason.
      DS_DISABLE_PAID_BACKENDS: "1"
      DS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Skip if a pull request already exists for this issue
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          # Two questions, and only the first one is authoritative.
          #
          # `claude/issue-<n>` is the branch the implementer below is told to create, so
          # a pull request from that head is the definitive "already done". GitHub
          # filters it server-side and returns one small node.
          #
          # The body scan is a courtesy for a pull request a human opened by hand with
          # "#<n>" in the body — and it is the query that broke. Selecting `body` with
          # `--limit 100` asks GitHub's GraphQL API for a hundred full pull-request
          # bodies in a single request, and it answered
          #
          #   GraphQL: Something went wrong while executing your query ...
          #   (repository.pullRequests.nodes.10)
          #
          # on run after run. Under `set -e` that killed the step at exit 1, and the job
          # never reached the model: every claude-implement failure so far is this line,
          # not a missing permission, a missing tool allowance or the label filter. So
          # it retries, asks for fewer bodies, and treats a persistent failure as a
          # warning rather than the end of the run — the branch query already covers the
          # duplicate this guard exists to prevent, and losing a heuristic to a
          # transient API error must not cost a labelled issue its implementation.
          gh_retry() {
            local out attempt
            for attempt in 1 2 3; do
              if out=$("$@" 2>&1); then
                printf '%s' "$out"
                return 0
              fi
              echo "attempt ${attempt} failed: ${out}" >&2
              sleep $((attempt * 3))
            done
            return 1
          }

          existing=$(gh_retry gh pr list --state all --limit 5 \
            --head "claude/issue-${ISSUE_NUMBER}" --json number --jq 'length') || {
            echo "Could not ask GitHub whether a pull request already exists for #${ISSUE_NUMBER}." >&2
            echo "Refusing to implement blind: a duplicate costs eighty turns of Opus." >&2
            exit 1
          }

          if [ "$existing" -eq 0 ]; then
            by_body=$(gh_retry gh pr list --state all --limit 50 --json body \
              --jq "[.[] | select((.body // \"\") | test(\"(^|[^0-9])#${ISSUE_NUMBER}([^0-9]|\$)\"))] | length") \
              || by_body=""
            if [ -z "$by_body" ]; then
              echo "::warning::The body scan for '#${ISSUE_NUMBER}' failed three times; relying on the branch check alone."
            else
              existing="$by_body"
            fi
          fi

          if [ "$existing" -gt 0 ]; then
            echo "A pull request already references issue #${ISSUE_NUMBER}; not implementing again."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.should_run == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-base.txt

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.should_run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Provide a CuraEngine stand-in
        # `CuraSlicer.__init__` refuses to construct without the binary on PATH, and
        # nothing in the default test selection executes it. Same stand-in as ci.yml.
        if: steps.guard.outputs.should_run == 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          install -m 755 infra/ci/curaengine_stub.sh "$HOME/.local/bin/CuraEngine"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-base.txt
          cp pythonsrc/config.template.py pythonsrc/config.py
          mkdir -p data/inputs data/outputs data/logs
          npm --prefix web ci

      - name: Implement with Opus
        if: steps.guard.outputs.should_run == 'true'
        uses: anthropics/claude-code-action@v1.0.216
        with:
          # `CLAUDE_CODE_OAUTH_TOKEN` is the only auth secret this repository has;
          # `/install-github-app` created it. `anthropic_api_key` is deliberately not
          # passed: an unset secret renders as the empty string, and the action maps
          # that straight onto `ANTHROPIC_API_KEY` in the model's environment, so
          # naming a secret that does not exist sets an empty credential rather than
          # no credential.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action creates and checks out the branch the prompt names, so Claude
          # does not have to guess whether it is already on it.
          branch_name_template: "{{prefix}}issue-{{entityNumber}}"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            Implement this issue on a new branch `claude/issue-${{ github.event.issue.number }}`. If a "Plan" comment exists, follow it. Follow CLAUDE.md. Add or update tests so every acceptance criterion is covered; run the test and lint commands from CLAUDE.md and make them pass. Open a PR that references this issue, copies its acceptance criteria into the PR body as a checklist, ticks each one you verified, and carries the issue's `risk:*` label. Keep the PR to this task only.
          claude_args: |
            --model claude-opus-5
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Edit,MultiEdit,Write,Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(pytest:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(npm:*),Bash(make:*)"

  fix:
    name: fix
    # The fix loop. `issue_comment` also fires on plain issues, so the pull_request
    # clause is what keeps this to PRs. No `prompt` input below: that is what selects
    # the action's interactive mode, which reads the @claude comment as the request.
    #
    # The state clauses are the second half of claude-review.yml's fix-loop guard, held
    # here as well because this job answers *any* @claude comment, not only the
    # reviewer's. A merged pull request has nowhere to push a fix to, and this job
    # carries a sixty-minute timeout, a PostgreSQL service and a full dependency
    # install before it reaches the model — the cost of answering is paid whether or
    # not the answer can land. Merged PR #52 was asked, and this job ran on it.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.issue.pull_request.merged_at == null &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DS_DISABLE_PAID_BACKENDS: "1"
      DS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-base.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Provide a CuraEngine stand-in
        run: |
          mkdir -p "$HOME/.local/bin"
          install -m 755 infra/ci/curaengine_stub.sh "$HOME/.local/bin/CuraEngine"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-base.txt
          cp pythonsrc/config.template.py pythonsrc/config.py
          mkdir -p data/inputs data/outputs data/logs
          npm --prefix web ci

      - name: Address the review with Opus
        uses: anthropics/claude-code-action@v1.0.216
        with:
          # `CLAUDE_CODE_OAUTH_TOKEN` is the only auth secret this repository has;
          # `/install-github-app` created it. `anthropic_api_key` is deliberately not
          # passed: an unset secret renders as the empty string, and the action maps
          # that straight onto `ANTHROPIC_API_KEY` in the model's environment, so
          # naming a secret that does not exist sets an empty credential rather than
          # no credential.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # claude-review.yml posts its fix request with the workflow token, so the
          # comment's author is github-actions[bot]. The action refuses bot authors
          # unless they are named here, and `*` is the form the security docs warn
          # about. This repository is private and only the two technical co-founders
          # can push, which is what makes naming one bot acceptable.
          allowed_bots: "github-actions[bot]"
          claude_args: |
            --model claude-opus-5
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Edit,MultiEdit,Write,Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(pytest:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(npm:*),Bash(make:*)"
