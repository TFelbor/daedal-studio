# Regenerate the committed licence data — the hard dependency tree, not a guess.
#
# The audit routines that consume this read files over the GitHub API; they cannot run
# pip-licenses, npm, or syft. So the data is produced here and committed to main, which
# turns "reads requirements-base.txt and package.json and infers the rest" into "reads
# the resolved transitive tree for every image this project ships".
#
# Three things about *how* it is produced are load-bearing:
#
#   * pip-licenses runs INSIDE the built images. `requirements-base.txt` is not what
#     ships: infra/docker/pipeline.Dockerfile installs diffusers from git HEAD and a
#     dozen `>=` ranges, and infra/docker/server.Dockerfile pip-installs an unpinned
#     list that appears in no requirements file at all. Resolving the tree anywhere but
#     inside the image would document an environment nobody runs.
#   * syft scans the same built images, so OS packages count too — cura-engine arrives
#     as an apt package and would be invisible to any Python-level tool.
#   * The TRELLIS.2 worker image is NOT built here. It compiles four CUDA extensions
#     against a GPU architecture, which no hosted runner has; `licenses/README.md`
#     documents the one command that produces `licenses/python-worker.json` on a CUDA
#     host. A gap that is named is auditable; one that is silently skipped is not.
#
# When it runs, and why not on every merge. This regenerates a tree that only changes
# when a dependency changes, and producing it costs two amd64 image builds plus syft —
# measured at ~349 billable minutes over 39 runs, the largest single consumer in this
# repository at the time. It used to run on every push to `main`, and the output of a
# merge that touched no dependency was two lines: `generated_at` and `commit` in
# `licenses/report.json`. So:
#
#   * `pull_request`, filtered to the files this data is a function of — the only
#     pre-merge look at a dependency's licence, and it fires on the rare PR that adds
#     one, not on every PR;
#   * `schedule`, on the 1st and the 15th — what catches drift that happens with no
#     commit here at all: a base image moving, an unpinned range resolving differently,
#     a package relicensing. This is the run that also does the macOS tree and the
#     registry SBOMs;
#   * `workflow_dispatch`, which now also commits — but only when it is dispatched
#     from `main` — so a dependency that lands between scheduled runs can be recorded
#     immediately instead of waiting for the 1st. Dispatched from a branch it still
#     builds, scans and scores; it just does not write the note or push.
#
# There is deliberately no `push:` trigger. `tests/test_licensing_guards.py` runs in
# `ci.yml` on every push and every pull request and is what actually enforces the
# rules; this workflow produces the evidence, and evidence a fortnight old is still
# evidence.

name: licence-data

on:
  pull_request:
    paths:
      - "requirements*.txt"
      - "web/package.json"
      - "web/package-lock.json"
      - "infra/docker/**"
      - "infra/scripts/licence_report.py"
      - "infra/scripts/normalise_licence_data.py"
      - "pythonsrc/licence_policy.py"
      - ".github/workflows/licence-data.yml"
  schedule:
    # The 1st and the 15th, 04:17 UTC. Base images and unpinned ranges move without a
    # commit here, so a scheduled run is what catches a dependency that changed
    # underneath us. Fortnightly rather than weekly because this is also the run that
    # pays for the macOS tree (billed at ten times Linux) and the registry SBOMs.
    - cron: "17 4 1,15 * *"
  workflow_dispatch:
    inputs:
      include_mac:
        description: "Also resolve requirements-mac.txt (dev-only tree; the only way to refresh it)"
        type: boolean
        default: false
      include_base_images:
        description: "Also SBOM the registry base images (slow: pulls the CUDA image)"
        type: boolean
        default: false

# Same rule as ci.yml: a newer run supersedes an in-flight one, except on `main`. The
# runs on `main` are the scheduled and dispatched ones, and those are the only runs that
# commit; cancelling one would drop its data commit and leave the next run reporting its
# delta against a tree a fortnight old.
concurrency:
  group: licence-data-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ── Python trees + SBOMs, from the images that actually ship ────────────────
  images:
    name: python + sbom (built images)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        # The pipeline image is ~6 GB with torch and diffusers in it. The hosted runner
        # ships with several toolchains this build never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
          syft version

      - run: mkdir -p licenses/sbom

      # ── pipeline-runner: Phases 1, 3-5, plus CuraEngine as an apt package ────
      - name: Build ds-base
        run: docker build --platform linux/amd64 -f infra/docker/base.Dockerfile -t ds-base:latest .

      - name: Build pipeline-runner
        run: docker build --platform linux/amd64 -f infra/docker/pipeline.Dockerfile -t ds-mvp-pipeline:latest .

      - name: Resolve the pipeline image's Python tree
        run: |
          docker run --rm --entrypoint /bin/sh ds-mvp-pipeline:latest -c '
            pip install --quiet --no-cache-dir pip-licenses >/dev/null 2>&1
            pip-licenses --format=json --with-urls --with-authors \
              --with-license-file --no-license-path --ignore-packages pip-licenses prettytable wcwidth
          ' > licenses/python.json
          python3 infra/scripts/normalise_licence_data.py licenses/python.json

      - name: SBOM the pipeline image
        # syft's raw output for this image is 16 MB, almost all of it per-package file
        # manifests. The normaliser keeps the licence-relevant fields.
        run: |
          syft ds-mvp-pipeline:latest -o syft-json > licenses/sbom/ds-mvp-pipeline.json
          python3 infra/scripts/normalise_licence_data.py licenses/sbom/ds-mvp-pipeline.json

      - name: Drop the pipeline image before building the next one
        run: |
          docker image rm ds-mvp-pipeline:latest ds-base:latest || true
          docker builder prune -af
          df -h /

      # ── api-server: an unpinned pip install that appears in no requirements file ──
      - name: Build api-server
        run: docker build --platform linux/amd64 -f infra/docker/server.Dockerfile -t ds-api-server:latest .

      - name: Resolve the api-server image's Python tree
        run: |
          docker run --rm --entrypoint /bin/sh ds-api-server:latest -c '
            pip install --quiet --no-cache-dir pip-licenses >/dev/null 2>&1
            pip-licenses --format=json --with-urls --with-authors \
              --with-license-file --no-license-path --ignore-packages pip-licenses prettytable wcwidth
          ' > licenses/python-api-server.json
          python3 infra/scripts/normalise_licence_data.py licenses/python-api-server.json

      - name: SBOM the api-server image
        run: |
          syft ds-api-server:latest -o syft-json > licenses/sbom/ds-api-server.json
          python3 infra/scripts/normalise_licence_data.py licenses/sbom/ds-api-server.json

      # Each of these four jobs uploads **only the files it wrote**, never `licenses/`
      # as a directory. A job's checkout already contains the committed copy of every
      # licence file, so `path: licenses/` put a full tree in all four artifacts — and
      # the report job below merges them into one directory with `merge-multiple`.
      # Every regenerated file therefore existed in four artifacts at once, three of
      # them stale, and two writers of the same path is how #129's corruption got in:
      # `sbom/base-ubuntu-22.04.json` came back byte-identical to its previous
      # committed version except for one window where a 22-byte run was duplicated and
      # a matching run dropped — content written twice at skewed offsets, not a
      # generator emitting bad JSON. Listing outputs explicitly means no path appears
      # in two artifacts, so there is nothing to race.
      - uses: actions/upload-artifact@v4
        with:
          name: licence-data-images
          path: |
            licenses/python.json
            licenses/python-api-server.json
            licenses/sbom/ds-mvp-pipeline.json
            licenses/sbom/ds-api-server.json
          retention-days: 14

  # ── The web app's production tree ───────────────────────────────────────────
  node:
    name: npm (web, production)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 20, not the 22 ci.yml builds on: `infra/docker/server.Dockerfile` builds the
          # bundle on `node:20-alpine`, and this job documents the tree that ships.
          # Resolution is lockfile-driven either way, so the pin is about honesty rather
          # than outcome.
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` rather than `npm install`: the committed lockfile is the tree the
      # api-server image builds from, and resolving it fresh would report a different
      # one from the one that ships.
      - run: npm ci
        working-directory: web

      - run: mkdir -p licenses

      - name: Resolve production licences
        run: |
          npx --yes license-checker@25.0.1 --json --production --relativeLicensePath > ../licenses/node.json
          cd .. && python3 infra/scripts/normalise_licence_data.py licenses/node.json
        working-directory: web

      # The build toolchain is not linked into the bundle, so it is scored separately
      # rather than mixed into the shipped tree — but it still runs on our machines and
      # in CI, so it is not unrecorded either.
      - name: Resolve build-toolchain licences
        run: |
          npx --yes license-checker@25.0.1 --json --relativeLicensePath > ../licenses/node-dev.json
          cd .. && python3 infra/scripts/normalise_licence_data.py licenses/node-dev.json
        working-directory: web

      - uses: actions/upload-artifact@v4
        with:
          name: licence-data-node
          path: |
            licenses/node.json
            licenses/node-dev.json
          retention-days: 14

  # ── Base images, from the registry: on the schedule, or on request ──────────
  base-images:
    name: sbom (registry base images)
    if: github.event_name == 'schedule' || inputs.include_base_images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - name: Install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - run: mkdir -p licenses/sbom
      - name: SBOM each base image
        # Scanned straight from the registry — no build, no local pull into docker.
        # nvidia/cuda is the TRELLIS.2 worker's base and is the reason this job runs on
        # the schedule or on request only: it is a multi-gigabyte devel image.
        run: |
          set -euo pipefail
          scan() {
            name="$2"
            echo "── $1"
            syft "registry:$1" -o syft-json > "licenses/sbom/base-$name.json"
            python3 infra/scripts/normalise_licence_data.py "licenses/sbom/base-$name.json"
          }
          scan ubuntu:22.04 ubuntu-22.04
          scan python:3.10-slim python-3.10-slim
          scan node:20-alpine node-20-alpine
          scan octoprint/octoprint:latest octoprint
          scan nvidia/cuda:12.4.1-devel-ubuntu22.04 nvidia-cuda-12.4.1-devel
      - uses: actions/upload-artifact@v4
        with:
          name: licence-data-base-images
          path: licenses/sbom/base-*.json
          retention-days: 14

  # ── The macOS-native dev path — on request only ────────────────────────────
  #
  # Not on the schedule (2026-09-12). Licence obligations — attribution, the source
  # offer, copyleft — attach to *distribution*, and `requirements-mac.txt` is not
  # distributed: it is the tree a developer installs on their own Apple Silicon
  # machine to run the models locally instead of paying for an API. Nothing in it
  # reaches a customer, so nothing in it needs attributing, and scanning it monthly
  # bought evidence for an obligation that does not exist.
  #
  # Kept as a dispatch rather than deleted, because the job is the only way this tree
  # can be enumerated at all — `mflux`/`mlx` are Apple-Silicon-only and will not
  # resolve on a Linux runner — and the posture is one decision away from changing.
  # **If the self-hosted path is ever offered to customers, this goes back on the
  # schedule before it ships**: at that point the tree is distributed and its 139
  # packages need the same evidence as every other ecosystem here. Run it with
  # `gh workflow run licence-data.yml -f include_mac=true`.
  #
  # `licenses/python-mac.json` stays committed and stays dated. It is evidence of what
  # that tree held on the day it was scanned, which is true and useful; what it is no
  # longer is a current picture, and `licenses/README.md` says so rather than leaving
  # a reader to infer it from a timestamp.
  mac:
    name: python (requirements-mac.txt)
    if: inputs.include_mac
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # mflux/mlx are Apple-Silicon-only, so this tree cannot be resolved on Linux at
      # all — the only options are a macOS runner or no data. Measured at 65 s, which
      # is one billed macOS minute and therefore ten against the allowance; the cost
      # was never the reason it came off the schedule. See the job's own comment.
      - name: Resolve the macOS tree
        run: |
          python -m venv /tmp/macvenv
          /tmp/macvenv/bin/pip install --quiet --upgrade pip
          /tmp/macvenv/bin/pip install --quiet -r requirements-mac.txt
          /tmp/macvenv/bin/pip install --quiet pip-licenses
          mkdir -p licenses
          /tmp/macvenv/bin/pip-licenses --format=json --with-urls --with-authors \
            --with-license-file --no-license-path \
            --ignore-packages pip-licenses prettytable wcwidth > licenses/python-mac.json
          python3 infra/scripts/normalise_licence_data.py licenses/python-mac.json
      - uses: actions/upload-artifact@v4
        with:
          name: licence-data-mac
          path: licenses/python-mac.json
          retention-days: 14

  # ── Score everything, and commit it on main ────────────────────────────────
  report:
    name: report + commit
    needs: [images, node, base-images, mac]
    # `always()` so a skipped optional job (mac, base-images) or one failed collector
    # still produces a report from whatever data exists — with the gap recorded in
    # `missing_sources` rather than silently lowering the package count.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      # The runs whose data is *recorded*: they write the dated audit note and they
      # commit. One expression with two readers below, because the pair drifted once —
      # when `push` was dropped from the triggers, the commit condition followed and the
      # audit-note condition did not, so a dispatched run would have committed data with
      # no note saying where it came from. `tests/test_licence_data.py` binds them.
      #
      # `main` only, and it is the ref that carries that, not the event. `schedule`
      # always runs on the default branch so the clause is free there; `workflow_dispatch`
      # can be started from any branch, and without it a dispatch from a feature branch
      # would commit regenerated `licenses/` and a dated audit note onto that branch —
      # the push below is `HEAD:${GITHUB_REF_NAME}`, not a hard-coded `main`. A dispatch
      # off `main` still builds, scans, scores and uploads the artifacts; it just does
      # not record. `pull_request` is excluded by the event clause, so a fork's PR
      # cannot push whatever its ref says.
      RECORDS_DATA: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the audit note diffs against the previous dated note.
          fetch-depth: 0

      # Four steps, not one `pattern:` with `merge-multiple: true`. Steps run one after
      # another by definition, so nothing here can write the same file twice at once —
      # which is what corrupted the SBOMs in #129. Each artifact's destination is also
      # its own: `upload-artifact` roots an artifact at the least common ancestor of the
      # files it matched, so `licence-data-base-images` (all of it under `licenses/sbom/`)
      # arrives rooted at `sbom` and has to be unpacked there, while the other three
      # root at `licenses`. Getting that wrong moves the base SBOMs up a directory,
      # where `_iter_source_files` would read them as unlabelled top-level sources.
      #
      # `continue-on-error` on each: `base-images` and `mac` only run on request, so a
      # missing artifact is routine. A collector that ran and *failed* leaves its file
      # absent, and the report says `incomplete` — see `EXPECTED_SOURCES`.
      - uses: actions/download-artifact@v4
        with:
          name: licence-data-images
          path: licenses
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: licence-data-node
          path: licenses
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: licence-data-base-images
          path: licenses/sbom
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: licence-data-mac
          path: licenses
        continue-on-error: true

      - name: Score the tree
        id: score
        # --fail-on deny: a non-commercial or in-process copyleft package fails the
        # build. Flags do not — they need a person, not a red X on every run.
        run: |
          set +e
          if [ "$RECORDS_DATA" = "true" ]; then
            python3 infra/scripts/licence_report.py --audit-out auto --fail-on deny
          else
            python3 infra/scripts/licence_report.py --fail-on deny
          fi
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: licence-report
          path: |
            licenses/
            docs/audits/
          retention-days: 90

      # Nothing unparseable is ever committed. The race above is fixed at its source,
      # but "fixed at its source" is what the last ten regenerations looked like from
      # here too, and a corrupt licence artifact on `main` is an audit that cannot be
      # reproduced. This runs after the report has been scored and uploaded — the
      # report names the bad file, and is worth keeping precisely when this fails.
      - name: Refuse to commit an unparseable licence artifact
        run: python3 infra/scripts/check_licence_json.py

      - name: Commit the data to main
        # `push` is gone (see the header); `workflow_dispatch` is added so a dependency
        # that lands between scheduled runs can be recorded without waiting for the 1st.
        # Same `RECORDS_DATA` the audit note above keys on, so the two cannot disagree —
        # and it is gated on `main`, so the `HEAD:${GITHUB_REF_NAME}` push below cannot
        # land licence data on whichever branch a dispatch happened to be started from.
        if: env.RECORDS_DATA == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A licenses docs/audits

          # report.json carries a timestamp, so it differs on every run. Committing on
          # that alone would put an empty licence commit on main after every run, so
          # the data files decide whether there is anything to record.
          #
          # This guard used to be unreachable, which is the shape worth remembering:
          # it was correct, and something upstream of it made its condition impossible.
          # `--audit-out auto` wrote `docs/audits/<today>-licence.md` unconditionally,
          # and a new date is a new path, so the staged diff always held a file that
          # was not `report.json` and the run always committed. The fix is upstream, in
          # `licence_report.py`: a note whose digest matches the previous note's is not
          # written at all (`audit_note_would_repeat`), because the digest already
          # excludes the timestamp and the sha for exactly this purpose. Nothing here
          # had to change — so if this ever starts committing on every run again, look
          # at what is writing into `docs/audits/`, not at the lines below.
          if git diff --cached --quiet -- licenses docs/audits; then
            echo "No licence data changed."
            exit 0
          fi
          if git diff --cached --name-only -- licenses docs/audits \
              | grep -qvE '^licenses/report\.json$'; then
            :
          else
            echo "Only the report timestamp changed — nothing to commit."
            git restore --staged licenses/report.json 2>/dev/null || true
            exit 0
          fi

          # [skip ci] as well as the GITHUB_TOKEN rule: a token-authored push does not
          # start another workflow run, and the marker says so to anyone reading the log.
          git commit -m "Regenerate committed licence data [skip ci]" \
                     -m "From ${GITHUB_SHA} via ${GITHUB_WORKFLOW}. Generated by CI; see licenses/README.md."
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Fail on a denied licence
        if: steps.score.outputs.exit_code != '0'
        run: |
          echo "::error::licence_report.py returned ${{ steps.score.outputs.exit_code }} — see the DENY lines above and licenses/report.json"
          exit 1
