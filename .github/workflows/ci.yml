# Continuous integration.
#
# The test suite has carried the load-bearing invariants of this project for months —
# the licence guards that keep the Apache-2.0 grant coherent, the single-database
# regression guard, the operator contract, the phase-banner protocol — and nothing ran
# them except a developer remembering to. `tests/test_licensing_guards.py` says in its
# own docstring that it is "all statically checkable, which is the point: they have to
# run in CI on a machine with no GPU". There was no CI.
#
# What this deliberately does not do: run Phase 1 or Phase 2. Both need weights and one
# needs an NVIDIA GPU, and `pytest.ini` already deselects the `slow` markers that reach
# them. What is left is everything a hosted runner can honestly check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same branch. `main` is excluded so a
# merge is never cancelled halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The telemetry database is PostgreSQL (Supabase) everywhere, so the suite runs
    # against a real PostgreSQL here too. `tests/conftest.py` would otherwise start a
    # throwaway container with the Docker CLI; a service container is faster on a
    # hosted runner and needs no daemon socket.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Belt and braces over `tests/conftest.py`, which sets the same flag in
      # `pytest_configure`. Phase 2's hosted backend bills EUR 0.32 a generation and
      # selects itself from `$PIXAZO_API_KEY`; a runner that ever gains one must not be
      # able to spend it.
      DS_DISABLE_PAID_BACKENDS: "1"
      # The suite administers this database: it creates one schema per test and drops
      # it. `DS_DATABASE_URL` is deliberately unset — conftest points it at a schema it
      # created before collection; pinning it here would defeat that.
      DS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-base.txt

      - name: Provide a CuraEngine stand-in
        # Phase 4 is a subprocess wrapper, and `CuraSlicer.__init__` refuses to
        # construct without the binary on PATH — so the slicer tests need *a file by
        # that name*. They do not need a slicer: each stubs `subprocess.run` and
        # asserts on the argv, and the whole suite passes with this stand-in, which
        # exits 70 on any real invocation rather than faking a successful slice.
        #
        # This step used to be `apt-get install -y cura-engine`, and it broke when
        # `ubuntu-latest` moved to 24.04. `cura-engine` is in universe on jammy
        # (22.04, 4.13) and again from 25.10 (5.0.0) onward, but noble has no
        # candidate — only a reference to it from `cura` — so apt failed with
        # "Package 'cura-engine' has no installation candidate".
        #
        # A stand-in rather than pinning `runs-on: ubuntu-22.04`: that would freeze
        # the whole job on a deprecated runner image in order to install a binary
        # nothing in the default selection executes. See
        # `infra/ci/curaengine_stub.sh` for why it fails loudly instead of quietly.
        run: |
          mkdir -p "$HOME/.local/bin"
          install -m 755 infra/ci/curaengine_stub.sh "$HOME/.local/bin/CuraEngine"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/CuraEngine" --version

      - name: Install Python dependencies
        # CPU wheels, from PyTorch's own index. Nothing under test imports torch —
        # `visualizer.py` is the only module that does and the suite never loads it —
        # but `accelerate` and `diffusers` pull it in, and the default index would drag
        # down the CUDA build for no reason. This mirrors `setup_venv.sh`'s Linux
        # no-GPU branch, so CI installs what a GPU-less developer installs.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-base.txt

      - name: Create the local config
        # `pythonsrc/config.py` is gitignored — it holds machine-specific paths — and
        # `pipeline.py`, `slicer.py` and `engineer.py` all import from it at module
        # scope. Copying the template is step one of the documented native setup, and
        # doing it here is also what keeps the template from rotting unnoticed.
        run: cp pythonsrc/config.template.py pythonsrc/config.py

      - name: Create runtime directories
        # `data/` is gitignored, so a fresh checkout has none of it.
        run: mkdir -p data/inputs data/outputs data/logs

      - name: Licence guards
        # Run first and named separately. A licence violation is not an ordinary test
        # failure — it is the one class of defect that cannot be fixed after a release —
        # so it should be legible from the job list without opening the log.
        #
        # `test_licence_data.py` joins it because it holds the same class of check over
        # the committed tree in `licenses/`: an undocumented data file, a workflow that
        # stopped writing an expected source, or a model swapped in the code and not in
        # ARCHITECTURE.md. Those go wrong silently and are what the audit reads.
        run: pytest tests/test_licensing_guards.py tests/test_licence_data.py

      - name: Dimensional accuracy (PRD N1)
        # Named separately for the same reason as the licence guards: the claim that a
        # compiled organizer's every designed feature reaches the slicer within 0,05 mm
        # is the product's promise, and a regression in it should be legible from the
        # job list. `test_organizer_dimensional_accuracy.py` sweeps **every registered
        # archetype** over the envelope its own module declares (issue #85) — on the
        # exported, reloaded STL, and a corner set again through Phase 3's assert path —
        # and ends with one line per archetype (`deck_box: 495/495`), so an archetype
        # that was added without an envelope and is therefore contributing nothing is
        # visible as a missing line rather than as a green run. `test_deck_box.py`
        # measures the first archetype's compiled and engineered output feature by
        # feature. Both run again in the full suite below.
        #
        # `test_archetype_registry.py` joins them because it is the other half of the
        # same guard: the sweep names an archetype that declares no envelope, and the
        # registry refuses it at the same moment as a module missing `measure`.
        run: pytest tests/test_organizer_dimensional_accuracy.py tests/test_deck_box.py tests/test_engineer_assert.py tests/test_archetype_registry.py

      - name: Test suite
        # The only step that measures coverage, and the only place `--cov` appears:
        # `pytest.ini`'s addopts deliberately does not carry it, so a local run is as
        # fast as it ever was and a developer opts in by repeating this line. The named
        # steps above are subsets and would report a figure for a fraction of the suite.
        #
        # The floor is the figure measured on `main` rounded down and then reduced by a
        # point — a gate against a drop, not a target. What it excludes is in
        # `.coveragerc` (the CUDA-only files no hosted runner can execute); the measured
        # figure, the date and this command are recorded in CLAUDE.md § Build and test,
        # and raising the floor means re-measuring and updating both.
        run: >-
          pytest tests/
          --cov=pythonsrc --cov=server
          --cov-report=term-missing:skip-covered
          --cov-fail-under=75

  web:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Reported, not enforced — for now. `npm run lint` currently fails on 27
        # pre-existing errors (mostly `react-hooks/immutability` and
        # `react-refresh/only-export-components`) that predate this workflow. A gate
        # that is red the day it lands teaches everyone to ignore the red, which is
        # worse than no gate; the build below is the enforced one. Flip this to
        # blocking — delete this line — once the backlog is at zero.
        continue-on-error: true
        run: npm run lint

      - name: Build
        # `npm run build` is `tsc -b && vite build`, so this is the type check as well.
        # The API server image serves `web/dist/`, which means a build that only breaks
        # in production is a server that starts and then 404s the whole app.
        run: npm run build
