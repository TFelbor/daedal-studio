# Continuous integration.
#
# The test suite has carried the load-bearing invariants of this project for months —
# the licence guards that keep the Apache-2.0 grant coherent, the single-database
# regression guard, the operator contract, the phase-banner protocol — and nothing ran
# them except a developer remembering to. `tests/test_licensing_guards.py` says in its
# own docstring that it is "all statically checkable, which is the point: they have to
# run in CI on a machine with no GPU". There was no CI.
#
# What this deliberately does not do: run Phase 1 or Phase 2. Both need weights and one
# needs an NVIDIA GPU, and `pytest.ini` already deselects the `slow` markers that reach
# them. What is left is everything a hosted runner can honestly check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same branch. `main` is excluded so a
# merge is never cancelled halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Belt and braces over `tests/conftest.py`, which sets the same flag in
      # `pytest_configure`. Phase 2's hosted backend bills EUR 0.32 a generation and
      # selects itself from `$PIXAZO_API_KEY`; a runner that ever gains one must not be
      # able to spend it.
      P2P_DISABLE_PAID_BACKENDS: "1"
      # `TELEMETRY_DB_PATH` is deliberately unset — see CLAUDE.md. conftest redirects it
      # to a temp directory before collection; pinning it here would defeat that.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-base.txt

      - name: Install CuraEngine
        # Phase 4 is a subprocess wrapper, and `CuraSlicer.__init__` refuses to
        # construct without the binary on PATH — so the slicer tests need it present
        # even though they stub the call itself. `cura-engine` lives in universe.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cura-engine
          CuraEngine --version || curaengine --version

      - name: Install Python dependencies
        # CPU wheels, from PyTorch's own index. Nothing under test imports torch —
        # `visualizer.py` is the only module that does and the suite never loads it —
        # but `accelerate` and `diffusers` pull it in, and the default index would drag
        # down the CUDA build for no reason. This mirrors `setup_venv.sh`'s Linux
        # no-GPU branch, so CI installs what a GPU-less developer installs.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-base.txt

      - name: Create the local config
        # `pythonsrc/config.py` is gitignored — it holds machine-specific paths — and
        # `pipeline.py`, `slicer.py` and `engineer.py` all import from it at module
        # scope. Copying the template is step one of the documented native setup, and
        # doing it here is also what keeps the template from rotting unnoticed.
        run: cp pythonsrc/config.template.py pythonsrc/config.py

      - name: Create runtime directories
        # `data/` is gitignored, so a fresh checkout has none of it.
        run: mkdir -p data/inputs data/outputs data/logs

      - name: Licence guards
        # Run first and named separately. A licence violation is not an ordinary test
        # failure — it is the one class of defect that cannot be fixed after a release —
        # so it should be legible from the job list without opening the log.
        run: pytest tests/test_licensing_guards.py

      - name: Test suite
        run: pytest tests/

  web:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Reported, not enforced — for now. `npm run lint` currently fails on 27
        # pre-existing errors (mostly `react-hooks/immutability` and
        # `react-refresh/only-export-components`) that predate this workflow. A gate
        # that is red the day it lands teaches everyone to ignore the red, which is
        # worse than no gate; the build below is the enforced one. Flip this to
        # blocking — delete this line — once the backlog is at zero.
        continue-on-error: true
        run: npm run lint

      - name: Build
        # `npm run build` is `tsc -b && vite build`, so this is the type check as well.
        # The API server image serves `web/dist/`, which means a build that only breaks
        # in production is a server that starts and then 404s the whole app.
        run: npm run build
